<!doctype html>
<!-- Dev-only zero-visual-change harness for the liquid-glass engine.
     Not part of the app build. Open http://localhost:5173/glass-verify.html

     Renders a deliberately hostile backdrop (1px checks, hairline diagonals,
     saturated blocks, fine text, smooth gradients) under one instance of every
     glass preset the app uses, then sets window.__glassReady once every element
     has been bound to a generated filter. scripts/glass-pixel-diff.cjs drives
     Electron against this page and byte-compares screenshots across a change.

     Nothing here is decorative — the elements carry no background or border so
     the refraction itself is what gets measured, not a frosted panel on top. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Liquid glass — zero-visual-change harness</title>
    <style>
      html, body { margin: 0; padding: 0; background: #101014; }
      body { width: 1200px; height: 900px; overflow: hidden; }

      /* ── Hostile backdrop ─────────────────────────────────────────── */
      .bg { position: absolute; inset: 0; }
      /* 1px checkerboard: maximum spatial frequency, so any resampling or
         displacement drift shows up immediately. */
      .bg-checks {
        background-image:
          linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%),
          linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%);
        background-size: 4px 4px;
        background-position: 0 0, 2px 2px;
        background-color: #000;
        height: 300px;
      }
      /* Saturated primaries — a saturate() change of any size shows here. */
      .bg-colors {
        position: absolute; top: 300px; left: 0; right: 0; height: 300px;
        background: linear-gradient(90deg,
          #ff0000 0%, #00ff00 16%, #0000ff 33%, #ffff00 50%,
          #00ffff 66%, #ff00ff 83%, #808080 100%);
      }
      /* Hairline diagonals + smooth ramp: sensitive to blur radius. */
      .bg-lines {
        position: absolute; top: 600px; left: 0; right: 0; height: 300px;
        background:
          repeating-linear-gradient(23deg, #fff 0 1px, #000 1px 5px),
          linear-gradient(180deg, #222, #ddd);
      }
      .bg-text {
        position: absolute; inset: 0; padding: 8px;
        font: 11px/1.15 monospace; color: #9fe; opacity: 0.85;
        word-break: break-all; white-space: pre-wrap;
      }

      /* ── Glass specimens ──────────────────────────────────────────── */
      .spec {
        position: absolute;
        background: transparent;
        border: 0;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div class="bg bg-checks"></div>
    <div class="bg-colors"></div>
    <div class="bg-lines"></div>
    <div class="bg-text" id="filler"></div>
    <div id="specimens"></div>
    <script type="module" src="/src/glass-verify.ts"></script>
  </body>
</html>
