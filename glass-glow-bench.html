<!doctype html>
<!-- Dev-only GPU benchmark for the edge-colour glow (src/lib/edge-color/).
     Not part of the build. Driven by scripts/glass-glow-bench.cjs.

     The glow is event-driven: idle, its blurs are cached and cost nothing. It
     only costs GPU while something MOVES — scrolling, dragging, a panel
     animating — because each overlay's blur then re-rasterises every frame.
     So this page keeps the glass surfaces moving continuously, which is the
     worst case the app actually hits (scrolling text under panels).

     Query params: glow=on|off, softness, scale, rimblur, surfaces -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edge-colour glow — GPU benchmark</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0e10; }
      .block { position: absolute; border-radius: 26px; }
      /* Colour sources the glow reads by geometry. */
      .edge-color-src { position: absolute; font: 12px/1.3 monospace; }
      .glass {
        position: fixed;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.10);
        -webkit-backdrop-filter: blur(10px) saturate(1.25);
        backdrop-filter: blur(10px) saturate(1.25);
        border: 1px solid rgba(255, 255, 255, 0.16);
        will-change: transform;
      }
      #hud {
        position: fixed; right: 8px; bottom: 8px; z-index: 99;
        font: 12px monospace; color: #0f0; background: #000a; padding: 4px 8px;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="hud">measuring…</div>
    <script type="module" src="/src/glass-glow-bench.ts"></script>
  </body>
</html>
